<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基督徒的光譜圖鑑：你是哪一種？</title>
<meta name="description" content="53 題，看看你在神學、救恩觀、恩賜、敬拜、教會治理和政治上的位置。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7;
    --card:#fffdf8;
    --ink:#2b2a28;
    --ink-2:#4a4740;
    --muted:#857d70;
    --line:#e3d9c6;
    --accent:#b5532f;
    --accent-soft:#f1dccf;
    --orange:#e8622c;
    --orange-dark:#bf4a1c;
    --pole:#756d61;
    --zl:#b3a998;
    --zone1:#efe7d8;
    --zone2:#e8dfcd;
    /* 六軸品牌輔助色（橘→橙→黃→綠），實際數值在 JS 的 AXIS_STYLE */
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 64px}
  h1,h2,h3,.serif{font-family:"Noto Serif TC",serif}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hidden{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .kicker{font-size:13px;letter-spacing:.2em;color:var(--accent);font-weight:700}

  /* 按鈕 */
  .btn{
    display:inline-block;border:none;border-radius:14px;padding:14px 24px;
    background:var(--orange);color:#fff;font-weight:700;font-size:16px;
    box-shadow:0 3px 0 var(--orange-dark);
    transition:transform .12s ease, box-shadow .12s ease
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-dark)}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.secondary:active{transform:scale(.985)}
  a.btn{text-decoration:none}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row.center{justify-content:center}
  .btn-row.center .btn{min-width:220px;padding:16px 32px;font-size:18px}

  /* 開始頁 */
  .intro{padding-top:8px;text-align:center}
  .cover{display:block;width:100%;max-width:400px;height:auto;border-radius:18px;margin:0 auto 22px;box-shadow:0 4px 18px rgba(60,45,20,.10)}

  /* 作答 */
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
  .chip{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:3px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:28px}
  .progress > div{height:100%;background:var(--accent);width:0;transition:width .25s}
  .qtext{font-family:"Noto Serif TC",serif;font-size:23px;line-height:1.55;font-weight:700;margin:6px 0 26px;min-height:110px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 16px;font-size:16px;color:var(--ink);
    transition:border-color .15s ease, background-color .15s ease, transform .12s ease
  }
  .opt:hover{border-color:#cdbfa6}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .likert .opt{display:flex;align-items:center;gap:12px}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid #c4b69d;flex:none;background:var(--card);transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease}
  .opt.sel .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
  .nav{display:flex;justify-content:space-between;margin-top:26px}
  .linkbtn{background:none;border:none;color:var(--muted);padding:8px 0;font-size:15px}
  .linkbtn:disabled{opacity:.35;cursor:default}


  /* 結果頁 Hero */
  .hero{text-align:center;padding:30px 4px 10px}
  .hero h1{font-size:34px;font-weight:900;line-height:1.35;margin:12px 0 10px;text-wrap:balance}
  .hero p{margin:0;color:var(--ink-2);font-size:16px}
  .hero-rule{width:40px;height:2px;background:var(--accent);opacity:.5;margin:22px auto 0;border:none}

  /* 彩蛋：核心直覺 */
  .fear-card{
    text-align:center;margin:22px 0 28px;padding:26px 20px 22px;border-radius:20px;
    background:linear-gradient(135deg,#f08a3a 0%,#e8622c 55%,#d4521f 100%);color:#fff;box-shadow:0 6px 18px rgba(160,75,30,.10)
  }
  .fear-label{font-size:14px;letter-spacing:.12em;opacity:.92;font-weight:500}
  .fear-answer{font-family:"Noto Serif TC",serif;font-size:29px;font-weight:900;margin:8px 0 10px;line-height:1.4;text-wrap:balance;word-break:keep-all}
  .fear-foot{font-size:13.5px;opacity:.9;line-height:1.7;max-width:22em;margin:0 auto}

  /* 結果卡 */
  .axis-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 18px 18px;margin:14px 0
  }
  .axis-name{font-size:13.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
  .axis-name i{width:8px;height:8px;border-radius:50%;background:var(--ax);display:inline-block}
  .zone-name{font-family:"Noto Serif TC",serif;font-size:32px;font-weight:900;margin:2px 0 0;color:var(--ink);line-height:1.35}
  .edge-badge{display:inline-flex;align-items:center;gap:7px;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--axt);letter-spacing:.02em}
  .edge-badge::before{content:"";width:16px;height:1.5px;background:currentColor;opacity:.7}
  .spectrum{margin-top:14px;padding-top:28px}
  .track{position:relative;height:12px;border-radius:999px;display:flex}
  .seg{height:100%}
  .seg:first-child{border-radius:999px 0 0 999px}
  .seg:last-child{border-radius:0 999px 999px 0}
  .seg:nth-child(odd){background:var(--zone1)}
  .seg:nth-child(even){background:var(--zone2)}
  .seg.on{background:var(--axa)}
  .you{position:absolute;top:50%;width:21px;height:21px;border-radius:50%;background:var(--ax);border:3px solid var(--card);box-shadow:0 0 0 1px rgba(43,42,40,.18);transform:translate(-50%,-50%)}
  .you-tag{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--axt);color:#fff;font-size:10.5px;font-weight:700;line-height:1;padding:4px 7px;border-radius:999px;white-space:nowrap;opacity:.92}
  .you-tag::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--axt)}
  .you-tag.l{left:-4px;transform:none}
  .you-tag.l::after{left:12px}
  .you-tag.r{left:auto;right:-4px;transform:none}
  .you-tag.r::after{left:auto;right:8px}
  .zlabels{display:flex;margin-top:8px}
  .zlabels span{text-align:center;font-size:12px;color:var(--zl);white-space:nowrap;line-height:1.4}
  .zlabels span.on{color:var(--axt);font-weight:700}
  .poles{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-top:4px;color:var(--pole)}
  .desc{margin:14px 0 0;font-size:15.5px;color:#3d3a34}
  .subs{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
  .sub{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:10px;font-size:13.5px;margin:6px 0}
  .subbar{position:relative;height:6px;background:var(--zone1);border-radius:999px}
  .subbar i{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--ax);border:2px solid var(--card);box-shadow:0 0 0 1px rgba(43,42,40,.15);transform:translate(-50%,-50%)}
  .gov-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .gov-chips span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;background:var(--paper);color:var(--ink-2)}
  .gov-chips span.on{background:var(--ax);border-color:var(--ax);color:#fff;font-weight:700}
  .small{font-size:13.5px;color:var(--muted);margin-top:10px}
  .subs + .small{margin-top:16px}
  .closing{text-align:center;padding:24px 18px;margin:26px 0;border-radius:18px;background:var(--ink);color:#f6f1e7}
  .closing p{margin:6px 0}
  .closing .serif{font-size:20px;font-weight:700;line-height:1.6}
  .share{text-align:center;margin:26px 0}
  /* 結果頁底部按鈕統一寬度 */
  .wide-btn{display:block;width:100%;max-width:300px;margin:0 auto;text-align:center}
  .btn-stack{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:12px}
  .btn.green{background:#4F7653;box-shadow:0 3px 0 #3a5a3e}
  .btn.green:active{box-shadow:0 1px 0 #3a5a3e}
  .share img{width:100%;max-width:360px;border-radius:12px;border:1px solid var(--line);display:block;margin:14px auto}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
  footer a{color:var(--accent);font-weight:700;text-decoration:none}
  .listen{text-align:center;margin:22px 0;padding:20px 16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
  .listen p{margin:0 0 12px;font-weight:700}

  /* 背景資料 */
  .field{display:block;margin:0 0 18px}
  .field span{display:block;font-weight:700;margin-bottom:6px}
  .field select{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink)
  }
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink-2);margin-top:6px}
  .consent input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}

  @media (max-width:420px){
    .qtext{font-size:20px;min-height:120px}
    .zone-name{font-size:29px}
    .hero h1{font-size:26px}
    .fear-answer{font-size:26px}
    .sub{grid-template-columns:1fr;gap:4px;margin:10px 0}
    .gov-chips span{font-size:13px;padding:3px 10px}
    .closing .serif{font-size:18px}
    .zlabels span{font-size:11.5px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>

  wors: { c: "#D3A62A", s: "#F4EDCF", t: "#8E6E14" },
  gov:  { c: "#7C873C", s: "#E9ECD8", t: "#5F6A2B" },
  poli: { c: "#4F7653", s: "#DEE9DF", t: "#3F6243" }
};
const axVars = key => `--ax:${AXIS_STYLE[key].c};--axs:${AXIS_STYLE[key].s};--axt:${AXIS_STYLE[key].t};--axa:${hexA(AXIS_STYLE[key].c, 0.38)}`;


/* ============================================
   狀態與儲存
   ============================================ */
const TOTAL = Q.length + 1; // 加上彩蛋題
let state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false };

function save() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(CONFIG.storageKey));
    if (s && Array.isArray(s.ans) && s.ans.length === Q.length) return s;
  } catch (e) {}
  return null;
}
function clearSave() {
  try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
}

/* ============================================
   畫面切換
   ============================================ */
const $ = id => document.getElementById(id);
function show(id) {
  ["intro", "quiz", "bg", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

/* ============================================
   作答
   ============================================ */
function renderQ() {
  const i = state.i;
  const isBonus = i === Q.length;
  const q = isBonus ? null : Q[i];

  const chip = $("axisChip");
  if (isBonus) {
    chip.innerHTML = "<i></i>彩蛋";
    chip.style.background = ""; chip.style.color = "";
  } else {
    chip.innerHTML = `<i></i>${AXES[q.a].name}`;
    chip.style.background = AXIS_STYLE[q.a].s; chip.style.color = AXIS_STYLE[q.a].t;
  }
  $("counter").textContent = `${i + 1} / ${TOTAL}`;
  const answered = state.ans.filter(v => v !== null).length + (state.bonus !== null ? 1 : 0);
  $("progressBar").style.width = (answered / TOTAL * 100) + "%";
  $("qtext").textContent = isBonus ? BONUS.t : q.t;

  const box = $("opts");
  box.innerHTML = "";
  box.className = "opts";

  let items, current;
  if (isBonus) {
    items = BONUS.o.map((t, k) => [t, k]);
    current = state.bonus;
  } else if (q.o) {
    items = q.o.map((pair, k) => [pair[0], k]);
    current = state.ans[i];
  } else {
    box.classList.add("likert");
    items = LIKERT.map((t, k) => [t, k]);
    current = state.ans[i];
  }

  items.forEach(([label, val]) => {
    const b = document.createElement("button");
    b.className = "opt" + (current === val ? " sel" : "");
    b.innerHTML = (box.classList.contains("likert") ? '<span class="dot"></span>' : "") + `<span>${label}</span>`;
    b.onclick = () => choose(val);
    box.appendChild(b);
  });

  $("prevBtn").disabled = i === 0;
  const hasAns = isBonus ? state.bonus !== null : state.ans[i] !== null;
  $("nextBtn").disabled = !hasAns;
  $("nextBtn").textContent = isBonus ? "看結果 →" : "下一題 →";
}

function choose(val) {
  if (state.i === Q.length) state.bonus = val;
  else state.ans[state.i] = val;
  save();
  renderQ();
  setTimeout(next, 220);
}

function next() {
  const i = state.i;
  const hasAns = i === Q.length ? state.bonus !== null : state.ans[i] !== null;
  if (!hasAns) return;
  if (i < Q.length) {
    state.i++; save(); renderQ();
  }
  else { show("bg"); }
}

/* ============================================
   背景資料與送出
   ============================================ */
function fillSelect(el, list) {
  el.innerHTML = '<option value="">（不想回答）</option>' +
    list.map(t => `<option value="${t}">${t}</option>`).join("");
}

function alreadySent() {
  try { return localStorage.getItem(CONFIG.sentKey) === "1"; } catch (e) { return false; }
}

function sendResult() {
  if (!CONFIG.endpoint || alreadySent()) return;
  const R = score();
  const g = R.gov;
  const kindName = k => AXES.gov.kinds[k].name;
  const payload = {
    church: state.church || "",
    years: state.years || "",
    theo: R.theo.total, theoZone: R.theo.zone.name,
    theoBible: R.theo.sub[0], theoCore: R.theo.sub[1], theoModern: R.theo.sub[2],
    salv: R.salv.total, salvZone: R.salv.zone.name,
    gift: R.gift.total, giftZone: R.gift.zone.name,
    wors: R.wors.total, worsZone: R.wors.zone.name,
    gov: g.kinds.map(kindName).join("＋"),
    govPastor: g.counts.pastor, govElder: g.counts.elder, govCong: g.counts.cong,
    poli: R.poli.total, poliZone: R.poli.zone.name,
    poliEcon: R.poli.sub[0], poliGov: R.poli.sub[1], poliSociety: R.poli.sub[2],
    fear: state.bonus !== null ? BONUS.o[state.bonus] : "",
    // 原始答案：量表題是 1 到 5（沒有反向換算），治理題是選到的制度
    answers: Q.map((q, i) => q.o ? kindName(q.o[state.ans[i]][1]) : state.ans[i] + 1)
  };
  try {
    fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    localStorage.setItem(CONFIG.sentKey, "1");
  } catch (e) {}
}

function finish() {
  state.church = $("churchSel").value;
  state.years = $("yearsSel").value;
  state.done = true;
  save();
  if ($("consentChk").checked) sendResult();
  showResult();
}
function prev() {
  if (state.i > 0) { state.i--; save(); renderQ(); }
}

/* ============================================
   計分
   ============================================ */
function score() {
  const res = {};
  for (const key of Object.keys(AXES)) {
    const ax = AXES[key];
    if (ax.type === "choice") {
      const counts = { pastor: 0, elder: 0, cong: 0 };
      Q.forEach((q, i) => { if (q.a === key && state.ans[i] !== null) counts[q.o[state.ans[i]][1]]++; });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      let kinds;
      if (sorted[0][1] >= 3) kinds = [sorted[0][0]];
      else kinds = [sorted[0][0], sorted[1][0]];
      res[key] = { kinds, counts };
      continue;
    }
    let total = 0;
    const sub = ax.groups ? ax.groups.map(() => 0) : null;
    Q.forEach((q, i) => {
      if (q.a !== key) return;
      const v = state.ans[i] + 1;
      const s = q.r ? 6 - v : v;
      total += s;
      if (sub) sub[q.g] += s;
    });
    const zone = ax.zones.find(z => total >= z.min && total <= z.max);
    res[key] = { total, zone, sub };
  }
  return res;
}

// 靠邊提示：只在結果卡多顯示一行小字，不是新的分類
const EDGE_NOTES = {
  theo: ["非常靠近『基要』端", "非常靠近『進步』端"],
  salv: ["非常靠近『加爾文』端", "非常靠近『亞米念』端"],
  gift: ["非常靠近『停止論』端", "非常靠近『續恩論』端"],
  wors: ["非常靠近『高教會』端", "非常靠近『低教會』端"],
  poli: ["非常靠近政治光譜左端", "非常靠近政治光譜右端"]
};
const EDGE_THRESHOLD = 0.08; // 光譜兩端各 8% 以內

// 依光譜上的實際位置（0＝最左、1＝最右）判斷是否非常靠邊；不靠邊回傳空字串
function edgeNote(key, total) {
  const ax = AXES[key];
  if (!EDGE_NOTES[key] || ax.type === "choice") return "";
  const p = pos(total, ax.min, ax.max, ax.highSide);
  if (p <= EDGE_THRESHOLD) return EDGE_NOTES[key][0];
  if (p >= 1 - EDGE_THRESHOLD) return EDGE_NOTES[key][1];
  return "";
}

// 把分數轉成光譜上 0 到 1 的位置
function pos(val, min, max, highSide) {
  const x = (val - min + 0.5) / (max - min + 1);
  return highSide === "left" ? 1 - x : x;
}

/* ============================================
   結果頁
   ============================================ */
function showResult() {
  const R = score();
  const box = $("resCards");
  box.innerHTML = "";

  for (const key of Object.keys(AXES)) {
    const ax = AXES[key];
    const r = R[key];
    const card = document.createElement("div");
    card.className = "axis-card";
    card.style.cssText = axVars(key);

    if (ax.type === "choice") {
      const names = r.kinds.map(k => ax.kinds[k].name);
      const title = r.kinds.length > 1 ? names.join("＋") + "（混合型）" : names[0];
      card.innerHTML = `
        <div class="axis-name"><i></i>${ax.name}</div>
        <div class="zone-name">${title}</div>
        <div class="gov-chips">
          ${Object.keys(ax.kinds).map(k => `<span class="${r.kinds.includes(k) ? "on" : ""}">${ax.kinds[k].name} ${r.counts[k]}</span>`).join("")}
        </div>
        <p class="desc">${r.kinds.map(k => ax.kinds[k].desc).join("<br>")}</p>
        <p class="small">傳統上還有「主教制」，由主教監督各地教會，常見於聖公會。</p>`;
      box.appendChild(card);
      continue;
    }

    // 光譜分區，依照左右方向排列
    const range = ax.max - ax.min + 1;
    let segs = ax.zones.map(z => ({
      z, w: (z.max - z.min + 1) / range * 100,
      start: ax.highSide === "left" ? (ax.max - z.max) : (z.min - ax.min)
    }));
    segs.sort((a, b) => a.start - b.start);

    const p = pos(r.total, ax.min, ax.max, ax.highSide) * 100;

    let subsHtml = "";
    if (r.sub) {
      subsHtml = `<div class="subs">
        ${ax.groups.map((g, k) => {
          const cnt = Q.filter(q => q.a === key && q.g === k).length;
          const sp = pos(r.sub[k], cnt, cnt * 5, ax.highSide) * 100;
          return `<div class="sub"><span>${g}</span><div class="subbar"><i style="left:${sp}%"></i></div></div>`;
        }).join("")}
      </div>`;
    }

    // 「你在這裡」標籤靠近邊緣時改成靠左／靠右對齊，避免被切掉
    const tagCls = p < 14 ? " l" : (p > 86 ? " r" : "");
    const note = edgeNote(key, r.total);
    card.innerHTML = `
      <div class="axis-name"><i></i>${ax.name}</div>
      <div class="zone-name">${r.zone.name}</div>
      ${note ? `<span class="edge-badge">${note}</span>` : ""}
      <div class="spectrum">
        <div class="track">
          ${segs.map(s => `<div class="seg ${s.z === r.zone ? "on" : ""}" style="width:${s.w}%"></div>`).join("")}
          <div class="you" style="left:${p}%"><span class="you-tag${tagCls}">你在這裡</span></div>
        </div>
        <div class="zlabels">${segs.map(s => `<span class="${s.z === r.zone ? "on" : ""}" style="width:${s.w}%">${s.z.name}</span>`).join("")}</div>
        <div class="poles"><span>← ${ax.leftLabel}</span><span>${ax.rightLabel} →</span></div>
      </div>
      <p class="desc">${r.zone.desc}</p>
      ${subsHtml}
      ${ax.footnote ? `<p class="small">${ax.footnote}</p>` : ""}`;
    box.appendChild(card);
  }

  $("fearAnswer").textContent = state.bonus !== null ? BONUS.o[state.bonus] : "（沒有作答）";
  $("cardImg").classList.add("hidden");
  $("cardHint").classList.add("hidden");
  $("dlBtn").classList.add("hidden");
  show("result");
}

/* ============================================
   光譜卡（1080 x 1920，適合直接貼 IG 限時動態）
   固定尺寸：所有內容都排在畫面內，不會因靠邊提示而加長
   ============================================ */
async function makeCard() {
  const R = score();
  try {
    await Promise.all([
      document.fonts.load('900 60px "Noto Serif TC"'),
      document.fonts.load('700 40px "Noto Sans TC"'),
      document.fonts.load('400 30px "Noto Sans TC"')
    ]);
  } catch (e) {}

  const W = 1080, H = 1920;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const serif = '"Noto Serif TC", serif';
  const sans = '"Noto Sans TC", sans-serif';
  const PAD = 80;
  const INK = "#2b2a28", MUTED = "#6f675b", ORANGE = "#e8622c";
  const POLE = "#756d61";

  x.fillStyle = "#f6f1e7"; x.fillRect(0, 0, W, H);
  x.textBaseline = "alphabetic";

  // 標題
  x.textAlign = "left";
  x.fillStyle = "#b5532f";
  x.font = `700 30px ${sans}`;
  x.fillText(CONFIG.podcastName + "　·　基督徒的光譜圖鑑", PAD, 130);
  x.fillStyle = INK;
  x.font = `900 84px ${serif}`;
  x.fillText("我的基督徒光譜", PAD, 228);
  x.fillStyle = ORANGE;
  roundRect(x, PAD, 262, 64, 6, 3); x.fill();

  // 六條簡化光譜
  const top = 320, rowH = 170;
  const barX = PAD, barW = W - PAD * 2, barH = 16;
  const AXIS_KEYS = Object.keys(AXES);
  AXIS_KEYS.forEach((key, idx) => {
    const ax = AXES[key], r = R[key], st = AXIS_STYLE[key];
    const ry = top + idx * rowH;

    // 軸名稱（左，前面一個輔助色小圓點）
    x.fillStyle = st.c;
    x.beginPath(); x.arc(PAD + 9, ry + 45, 9, 0, Math.PI * 2); x.fill();
    x.textAlign = "left";
    x.fillStyle = MUTED;
    x.font = `700 34px ${sans}`;
    x.fillText(ax.name, PAD + 30, ry + 57);

    // 主要分類（右，大字）
    const label = ax.type === "choice"
      ? r.kinds.map(k => ax.kinds[k].name).join("＋")
      : r.zone.name;
    x.fillStyle = INK;
    x.textAlign = "right";
    fitText(x, label, W - PAD, ry + 64, 560, 62, `900 ? ${serif}`);
    x.textAlign = "left";

    if (ax.type === "choice") {
      // 教會治理：三個小膠囊
      let cx = PAD;
      const cy = ry + 86;
      x.font = `700 28px ${sans}`;
      for (const k of Object.keys(ax.kinds)) {
        const t = `${ax.kinds[k].name} ${r.counts[k]}`;
        const tw = x.measureText(t).width + 44;
        const on = r.kinds.includes(k);
        x.fillStyle = on ? st.c : "#ece4d5";
        roundRect(x, cx, cy, tw, 54, 27); x.fill();
        x.fillStyle = on ? "#ffffff" : "#5e574c";
        x.fillText(t, cx + 22, cy + 37);
        cx += tw + 14;
      }
    } else {
      // 光譜條：分區色塊＋目前所在區塊用輔助色
      const midY = ry + 106;
      const range = ax.max - ax.min + 1;
      const segs = ax.zones.map(z => ({
        z, w: (z.max - z.min + 1) / range,
        start: ax.highSide === "left" ? (ax.max - z.max) : (z.min - ax.min)
      })).sort((a, b) => a.start - b.start);
      x.save();
      roundRect(x, barX, midY - barH / 2, barW, barH, barH / 2); x.clip();
      let sx = barX;
      segs.forEach((sg, k) => {
        const w = sg.w * barW;
        x.fillStyle = sg.z === r.zone ? hexA(st.c, 0.38) : (k % 2 ? "#e8dfcd" : "#efe7d8");
        x.fillRect(sx, midY - barH / 2, w + 1, barH);
        sx += w;
      });
      x.restore();

      // 你的位置
      const p = pos(r.total, ax.min, ax.max, ax.highSide);
      const dotR = 19;
      const cx = Math.min(barX + barW - dotR, Math.max(barX + dotR, barX + p * barW));
      x.fillStyle = "#fffdf8";
      x.beginPath(); x.arc(cx, midY, dotR + 6, 0, Math.PI * 2); x.fill();
      x.fillStyle = st.c;
      x.beginPath(); x.arc(cx, midY, dotR, 0, Math.PI * 2); x.fill();

      // 兩端名稱
      x.font = `700 26px ${sans}`;
      x.fillStyle = POLE; x.textAlign = "left";
      x.fillText(ax.leftLabel, barX, ry + 152);
      x.fillStyle = POLE; x.textAlign = "right";
      x.fillText(ax.rightLabel, barX + barW, ry + 152);

      // 非常靠邊：中間放一個小膠囊
      const note = edgeNote(key, r.total);
      if (note) {
        x.font = `700 22px ${sans}`;
        const tw = x.measureText(note).width + 32;
        const bx = W / 2 - tw / 2;
        x.fillStyle = st.s;
        roundRect(x, bx, ry + 128, tw, 34, 17); x.fill();
        x.fillStyle = st.t; x.textAlign = "center";
        x.fillText(note, W / 2, ry + 153);
      }
      x.textAlign = "left";
    }

    // 分隔細線
    if (idx < AXIS_KEYS.length - 1) {
      x.fillStyle = "#e3d9c6";
      x.fillRect(PAD, ry + rowH - 4, barW, 2);
    }
  });

  // 彩蛋：我最怕基督教失去
  const fy = top + rowH * 6 + 34, fh = 250;
  x.save();
  x.shadowColor = "rgba(160,75,30,0.14)"; x.shadowBlur = 36; x.shadowOffsetY = 10;
  x.fillStyle = ORANGE;
  roundRect(x, PAD, fy, W - PAD * 2, fh, 30); x.fill();
  x.restore();
  x.textAlign = "center";
  x.fillStyle = "#fde6da";
  x.font = `500 34px ${sans}`;
  x.fillText("我最怕基督教失去：", W / 2, fy + 82);
  x.fillStyle = "#ffffff";
  fitText(x, state.bonus !== null ? BONUS.o[state.bonus] : "（沒有作答）", W / 2, fy + 178, W - PAD * 2 - 80, 68, `900 ? ${serif}`);

  // 頁尾
  x.fillStyle = INK;
  x.font = `900 40px ${serif}`;
  x.fillText(`《${CONFIG.podcastName}》`, W / 2, H - 140);
  x.fillStyle = "#857d70";
  x.font = `400 30px ${sans}`;
  x.fillText("你的基督徒光譜，長什麼樣子？", W / 2, H - 86);
  x.textAlign = "left";

  const url = c.toDataURL("image/png");
  $("cardImg").src = url;
  $("cardImg").classList.remove("hidden");
  $("cardHint").classList.remove("hidden");
  $("dlBtn").href = url;
  $("dlBtn").classList.remove("hidden");
}

// #rrggbb 轉成帶透明度的顏色
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

// 文字太長時自動縮小字級，避免超出範圍；fontTpl 裡的 ? 會換成字級
function fitText(ctx, text, tx, ty, maxW, size, fontTpl) {
  let s = size;
  ctx.font = fontTpl.replace("?", s + "px");
  while (ctx.measureText(text).width > maxW && s > 20) {
    s -= 2;
    ctx.font = fontTpl.replace("?", s + "px");
  }
  ctx.fillText(text, tx, ty);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================
   啟動
   ============================================ */
if ($("kicker")) $("kicker").textContent = CONFIG.podcastName;
if (CONFIG.podcastUrl) {
  $("footer").innerHTML = `<a href="${CONFIG.podcastUrl}" target="_blank" rel="noopener">${CONFIG.podcastName}</a>　·　基督徒的光譜圖鑑`;
  $("listenBtn").href = CONFIG.podcastUrl;
  $("listenBox").classList.remove("hidden");
} else {
  $("footer").textContent = CONFIG.podcastName + "　·　基督徒的光譜圖鑑";
}

const saved = load();
if (saved) {
  if (saved.done) { state = saved; showResult(); }
  else if (saved.ans.some(v => v !== null)) $("resumeBtn").classList.remove("hidden");
}

$("startBtn").onclick = () => {
  state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false };
  save(); show("quiz"); renderQ();
};
$("resumeBtn").onclick = () => { state = saved; show("quiz"); renderQ(); };

$("prevBtn").onclick = prev;
$("nextBtn").onclick = next;
$("makeCardBtn").onclick = makeCard;
fillSelect($("churchSel"), CHURCH_TYPES);
fillSelect($("yearsSel"), YEARS);
$("finishBtn").onclick = finish;
$("bgBackBtn").onclick = () => { show("quiz"); renderQ(); };
$("restartBtn").onclick = () => { clearSave(); state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false }; show("intro"); $("resumeBtn").classList.add("hidden"); };
</script>
