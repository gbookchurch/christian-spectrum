<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基督徒的光譜圖鑑：你是哪一種？</title>
<meta name="description" content="53 題，看看你在神學、救恩觀、恩賜、敬拜、教會治理和政治上的位置。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f1e7;
    --card:#fffdf8;
    --ink:#2b2a28;
    --muted:#857d70;
    --line:#ddd3c1;
    --accent:#b5532f;
    --accent-soft:#f1dccf;
    --orange:#e8622c;
    --orange-dark:#bf4a1c;
    --blue:#3f6b8a;
    --zone1:#efe6d6;
    --zone2:#e6dac5;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 64px}
  h1,h2,h3,.serif{font-family:"Noto Serif TC",serif}
  button{font:inherit;cursor:pointer}
  .hidden{display:none !important}

  /* intro */
  .intro{padding-top:8px;text-align:center}
  .kicker{font-size:13px;letter-spacing:.2em;color:var(--accent);font-weight:700}
  .intro h1{font-size:34px;line-height:1.3;margin:10px 0 18px;font-weight:900}
  .intro p{margin:0 0 14px;color:#4a4740}
  .note{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin:22px 0;font-size:15px;color:#4a4740
  }
  .note b{color:var(--ink)}
  .axes-list{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 26px}
  .axes-list span{
    border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:4px 12px;font-size:14px
  }
  .btn{
    display:inline-block;border:none;border-radius:12px;padding:14px 22px;
    background:var(--orange);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 0 var(--orange-dark)
  }
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--orange-dark)}
  a.btn{text-decoration:none}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row.center{justify-content:center}
  .btn-row.center .btn{min-width:220px;padding:16px 32px;font-size:18px;border-radius:14px}
  .center-text{text-align:center;margin-top:28px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .cover{display:block;width:100%;max-width:480px;margin-left:auto !important;margin-right:auto !important;height:auto;border-radius:18px;box-shadow:0 6px 24px rgba(60,45,20,.12);margin:0 0 22px}
  .intro .axes-list{justify-content:center}
  .intro-note{text-align:center;font-size:15.5px;color:#4a4740;margin:0 auto 24px;max-width:30em}

  /* quiz */
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
  .chip{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:3px 12px;font-size:13px}
  .progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:28px}
  .progress > div{height:100%;background:var(--accent);width:0;transition:width .25s}
  .qtext{font-family:"Noto Serif TC",serif;font-size:23px;line-height:1.55;font-weight:700;margin:6px 0 26px;min-height:110px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:13px 16px;font-size:16px;color:var(--ink);transition:border-color .15s, background .15s
  }
  .opt:hover{border-color:#bfb19a}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .likert .opt{display:flex;align-items:center;gap:12px}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid #bfb19a;flex:none}
  .opt.sel .dot{border-color:var(--accent);background:var(--accent)}
  .nav{display:flex;justify-content:space-between;margin-top:26px}
  .linkbtn{background:none;border:none;color:var(--muted);padding:8px 0;font-size:15px}
  .linkbtn:disabled{opacity:.35;cursor:default}

  /* result */
  .res-head{text-align:center;padding:18px 0 8px}
  .res-head h1{font-size:28px;margin:6px 0 8px;font-weight:900}
  .res-head p{color:#4a4740;margin:0}
  .axis-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 16px;margin:16px 0
  }
  .axis-name{font-size:14px;color:var(--muted);font-weight:500}
  .zone-name{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:900;margin:2px 0 12px;color:var(--accent)}
  .bar{position:relative;height:30px;border-radius:8px;overflow:hidden;display:flex}
  .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#7a715f;white-space:nowrap;overflow:hidden}
  .seg:nth-child(odd){background:var(--zone1)}
  .seg:nth-child(even){background:var(--zone2)}
  .seg.on{background:var(--accent);color:#fff;font-weight:700}
  .marker-wrap{position:relative;height:14px;margin-top:2px}
  .marker{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:10px solid var(--ink);transform:translateX(-7px)}
  .poles{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
  .poles span:first-child, .subpoles span:first-child{color:var(--accent)}
  .poles span:last-child, .subpoles span:last-child{color:var(--blue)}
  .desc{margin:12px 0 0;font-size:15.5px;color:#3d3a34}
  .subs{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .sub{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:10px;font-size:13.5px;margin:6px 0}
  .subbar{position:relative;height:8px;background:var(--zone1);border-radius:999px}
  .subbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--blue);transform:translateX(-7px)}
  .subpoles{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-left:calc(7.5em + 10px)}
  .gov-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .gov-chips span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;background:var(--paper)}
  .gov-chips span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .small{font-size:13.5px;color:var(--muted);margin-top:10px}
  .closing{
    text-align:center;padding:22px 18px;margin:22px 0;border-radius:16px;
    background:var(--ink);color:#f6f1e7
  }
  .closing p{margin:6px 0}
  .fear-card{text-align:center;margin:18px 0 6px;padding:20px 18px;border-radius:16px;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-dark)}
  .fear-label{font-size:15px;opacity:.9;font-weight:500}
  .fear-answer{font-family:"Noto Serif TC",serif;font-size:26px;font-weight:900;margin-top:4px;line-height:1.4}
  .closing .serif{font-size:20px;font-weight:700}
  .share{text-align:center;margin:26px 0}
  .share img{width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line);display:block;margin:14px auto}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
  footer a{color:var(--accent);font-weight:700;text-decoration:none}
  .listen{text-align:center;margin:22px 0;padding:20px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .listen p{margin:0 0 12px;font-weight:700}

  /* 背景資料 */
  .field{display:block;margin:0 0 18px}
  .field span{display:block;font-weight:700;margin-bottom:6px}
  .field select{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink)
  }
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#4a4740;margin-top:6px}
  .consent input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}

  @media (max-width:420px){
    .intro h1{font-size:29px}
    .qtext{font-size:20px;min-height:120px}
    .seg{font-size:11px}
    .zone-name{font-size:23px}
    .sub{grid-template-columns:1fr;gap:4px;margin:10px 0}
    .subpoles{margin-left:0}
    .gov-chips span{font-size:13px;padding:3px 10px}
    .closing .serif{font-size:18px}
  }
</style>
</head>

const LIKERT = ["非常不同意", "不同意", "普通／不確定", "同意", "非常同意"];

/* ============================================
   狀態與儲存
   ============================================ */
const TOTAL = Q.length + 1; // 加上彩蛋題
let state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false };

function save() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(CONFIG.storageKey));
    if (s && Array.isArray(s.ans) && s.ans.length === Q.length) return s;
  } catch (e) {}
  return null;
}
function clearSave() {
  try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {}
}

/* ============================================
   畫面切換
   ============================================ */
const $ = id => document.getElementById(id);
function show(id) {
  ["intro", "quiz", "bg", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}

/* ============================================
   作答
   ============================================ */
function renderQ() {
  const i = state.i;
  const isBonus = i === Q.length;
  const q = isBonus ? null : Q[i];

  $("axisChip").textContent = isBonus ? "彩蛋" : AXES[q.a].name;
  $("counter").textContent = `${i + 1} / ${TOTAL}`;
  const answered = state.ans.filter(v => v !== null).length + (state.bonus !== null ? 1 : 0);
  $("progressBar").style.width = (answered / TOTAL * 100) + "%";
  $("qtext").textContent = isBonus ? BONUS.t : q.t;

  const box = $("opts");
  box.innerHTML = "";
  box.className = "opts";

  let items, current;
  if (isBonus) {
    items = BONUS.o.map((t, k) => [t, k]);
    current = state.bonus;
  } else if (q.o) {
    items = q.o.map((pair, k) => [pair[0], k]);
    current = state.ans[i];
  } else {
    box.classList.add("likert");
    items = LIKERT.map((t, k) => [t, k]);
    current = state.ans[i];
  }

  items.forEach(([label, val]) => {
    const b = document.createElement("button");
    b.className = "opt" + (current === val ? " sel" : "");
    b.innerHTML = (box.classList.contains("likert") ? '<span class="dot"></span>' : "") + `<span>${label}</span>`;
    b.onclick = () => choose(val);
    box.appendChild(b);
  });

  $("prevBtn").disabled = i === 0;
  const hasAns = isBonus ? state.bonus !== null : state.ans[i] !== null;
  $("nextBtn").disabled = !hasAns;
  $("nextBtn").textContent = isBonus ? "看結果 →" : "下一題 →";
}

function choose(val) {
  if (state.i === Q.length) state.bonus = val;
  else state.ans[state.i] = val;
  save();
  renderQ();
  setTimeout(next, 220);
}

function next() {
  const i = state.i;
  const hasAns = i === Q.length ? state.bonus !== null : state.ans[i] !== null;
  if (!hasAns) return;
  if (i < Q.length) { state.i++; save(); renderQ(); }
  else { show("bg"); }
}

/* ============================================
   背景資料與送出
   ============================================ */
function fillSelect(el, list) {
  el.innerHTML = '<option value="">（不想回答）</option>' +
    list.map(t => `<option value="${t}">${t}</option>`).join("");
}

function alreadySent() {
  try { return localStorage.getItem(CONFIG.sentKey) === "1"; } catch (e) { return false; }
}

function sendResult() {
  if (!CONFIG.endpoint || alreadySent()) return;
  const R = score();
  const g = R.gov;
  const kindName = k => AXES.gov.kinds[k].name;
  const payload = {
    church: state.church || "",
    years: state.years || "",
    theo: R.theo.total, theoZone: R.theo.zone.name,
    theoBible: R.theo.sub[0], theoCore: R.theo.sub[1], theoModern: R.theo.sub[2],
    salv: R.salv.total, salvZone: R.salv.zone.name,
    gift: R.gift.total, giftZone: R.gift.zone.name,
    wors: R.wors.total, worsZone: R.wors.zone.name,
    gov: g.kinds.map(kindName).join("＋"),
    govPastor: g.counts.pastor, govElder: g.counts.elder, govCong: g.counts.cong,
    poli: R.poli.total, poliZone: R.poli.zone.name,
    poliEcon: R.poli.sub[0], poliGov: R.poli.sub[1], poliSociety: R.poli.sub[2],
    fear: state.bonus !== null ? BONUS.o[state.bonus] : "",
    // 原始答案：量表題是 1 到 5（沒有反向換算），治理題是選到的制度
    answers: Q.map((q, i) => q.o ? kindName(q.o[state.ans[i]][1]) : state.ans[i] + 1)
  };
  try {
    fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    localStorage.setItem(CONFIG.sentKey, "1");
  } catch (e) {}
}

function finish() {
  state.church = $("churchSel").value;
  state.years = $("yearsSel").value;
  state.done = true;
  save();
  if ($("consentChk").checked) sendResult();
  showResult();
}
function prev() {
  if (state.i > 0) { state.i--; save(); renderQ(); }
}

/* ============================================
   計分
   ============================================ */
function score() {
  const res = {};
  for (const key of Object.keys(AXES)) {
    const ax = AXES[key];
    if (ax.type === "choice") {
      const counts = { pastor: 0, elder: 0, cong: 0 };
      Q.forEach((q, i) => { if (q.a === key && state.ans[i] !== null) counts[q.o[state.ans[i]][1]]++; });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      let kinds;
      if (sorted[0][1] >= 3) kinds = [sorted[0][0]];
      else kinds = [sorted[0][0], sorted[1][0]];
      res[key] = { kinds, counts };
      continue;
    }
    let total = 0;
    const sub = ax.groups ? ax.groups.map(() => 0) : null;
    Q.forEach((q, i) => {
      if (q.a !== key) return;
      const v = state.ans[i] + 1;
      const s = q.r ? 6 - v : v;
      total += s;
      if (sub) sub[q.g] += s;
    });
    const zone = ax.zones.find(z => total >= z.min && total <= z.max);
    res[key] = { total, zone, sub };
  }
  return res;
}

// 把分數轉成光譜上 0 到 1 的位置
function pos(val, min, max, highSide) {
  const x = (val - min + 0.5) / (max - min + 1);
  return highSide === "left" ? 1 - x : x;
}

/* ============================================
   結果頁
   ============================================ */
function showResult() {
  const R = score();
  const box = $("resCards");
  box.innerHTML = "";

  for (const key of Object.keys(AXES)) {
    const ax = AXES[key];
    const r = R[key];
    const card = document.createElement("div");
    card.className = "axis-card";

    if (ax.type === "choice") {
      const names = r.kinds.map(k => ax.kinds[k].name);
      const title = r.kinds.length > 1 ? names.join("＋") + "（混合型）" : names[0];
      card.innerHTML = `
        <div class="axis-name">${ax.name}</div>
        <div class="zone-name">${title}</div>
        <div class="gov-chips">
          ${Object.keys(ax.kinds).map(k => `<span class="${r.kinds.includes(k) ? "on" : ""}">${ax.kinds[k].name} ${r.counts[k]}</span>`).join("")}
        </div>
        <p class="desc">${r.kinds.map(k => ax.kinds[k].desc).join("<br>")}</p>
        <p class="small">傳統上還有「主教制」，由主教監督各地教會，常見於聖公會。</p>`;
      box.appendChild(card);
      continue;
    }

    // 光譜分區，依照左右方向排列
    const range = ax.max - ax.min + 1;
    let segs = ax.zones.map(z => ({
      z, w: (z.max - z.min + 1) / range * 100,
      start: ax.highSide === "left" ? (ax.max - z.max) : (z.min - ax.min)
    }));
    segs.sort((a, b) => a.start - b.start);

    const p = pos(r.total, ax.min, ax.max, ax.highSide) * 100;

    let subsHtml = "";
    if (r.sub) {
      subsHtml = `<div class="subs">
        ${ax.groups.map((g, k) => {
          const cnt = Q.filter(q => q.a === key && q.g === k).length;
          const sp = pos(r.sub[k], cnt, cnt * 5, ax.highSide) * 100;
          return `<div class="sub"><span>${g}</span><div class="subbar"><i style="left:${sp}%"></i></div></div>`;
        }).join("")}
        <div class="subpoles"><span>${ax.leftLabel}</span><span>${ax.rightLabel}</span></div>
      </div>`;
    }

    card.innerHTML = `
      <div class="axis-name">${ax.name}</div>
      <div class="zone-name">${r.zone.name}</div>
      <div class="bar">${segs.map(s => `<div class="seg ${s.z === r.zone ? "on" : ""}" style="width:${s.w}%">${s.z.name}</div>`).join("")}</div>
      <div class="marker-wrap"><div class="marker" style="left:${p}%"></div></div>
      <div class="poles"><span>${ax.leftLabel}</span><span>${ax.rightLabel}</span></div>
      <p class="desc">${r.zone.desc}</p>
      ${subsHtml}
      ${ax.footnote ? `<p class="small">${ax.footnote}</p>` : ""}`;
    box.appendChild(card);
  }

  $("fearAnswer").textContent = state.bonus !== null ? BONUS.o[state.bonus] : "（沒有作答）";
  $("cardImg").classList.add("hidden");
  $("cardHint").classList.add("hidden");
  $("dlBtn").classList.add("hidden");
  show("result");
}

/* ============================================
   光譜卡（1080 x 1350，適合 IG）
   ============================================ */
async function makeCard() {
  const R = score();
  try {
    await Promise.all([
      document.fonts.load('900 60px "Noto Serif TC"'),
      document.fonts.load('700 40px "Noto Sans TC"'),
      document.fonts.load('400 30px "Noto Sans TC"')
    ]);
  } catch (e) {}

  // 1080 x 1920：手機直式、IG 限時動態的比例，每一軸有足夠的空間
  const W = 1080, H = 1920;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const serif = '"Noto Serif TC", serif';
  const sans = '"Noto Sans TC", sans-serif';
  const PAD = 90;

  x.fillStyle = "#f6f1e7"; x.fillRect(0, 0, W, H);

  // 標題
  x.textBaseline = "alphabetic";
  x.fillStyle = "#b5532f";
  x.font = `700 32px ${sans}`;
  x.fillText("我的基督徒光譜", PAD, 150);
  x.fillStyle = "#2b2a28";
  x.font = `900 76px ${serif}`;
  x.fillText("基督徒的光譜圖鑑", PAD, 245);
  x.fillStyle = "#ddd3c1";
  x.fillRect(PAD, 290, W - PAD * 2, 3);

  // 六個軸：每一軸放在自己的卡片裡，兩端標籤和光譜條在同一行
  const LEFT_C = "#b5532f", RIGHT_C = "#3f6b8a", INK = "#2b2a28";
  const panelX = PAD - 20, panelW = W - (PAD - 20) * 2;
  const panelH = 196, gap = 18, inner = 36;
  const labelW = 120; // 兩端標籤的固定寬度，讓每條光譜一樣長
  let y = 320;

  for (const key of Object.keys(AXES)) {
    const ax = AXES[key];
    const r = R[key];

    // 卡片底
    x.fillStyle = "#fffdf8";
    roundRect(x, panelX, y, panelW, panelH, 24); x.fill();
    x.strokeStyle = "#e3d9c6"; x.lineWidth = 2;
    roundRect(x, panelX, y, panelW, panelH, 24); x.stroke();

    const left = panelX + inner, right = panelX + panelW - inner;

    // 第一行：軸名稱（左）＋結果（右）
    x.textAlign = "left";
    x.fillStyle = "#6f675b";
    x.font = `700 36px ${sans}`;
    x.fillText(ax.name, left, y + 66);

    const label = ax.type === "choice"
      ? r.kinds.map(k => ax.kinds[k].name).join("＋")
      : r.zone.name;

    let p = null, resultColor = INK;
    if (ax.type !== "choice") {
      p = pos(r.total, ax.min, ax.max, ax.highSide);
      if (p < 0.4) resultColor = LEFT_C;
      else if (p > 0.6) resultColor = RIGHT_C;
    } else {
      resultColor = LEFT_C;
    }
    x.fillStyle = resultColor;
    x.textAlign = "right";
    fitText(x, label, right, y + 72, panelW * 0.6, 60, `900 ? ${serif}`);
    x.textAlign = "left";

    if (ax.type !== "choice") {
      // 第二行：左標籤 ── 光譜條 ── 右標籤
      const midY = y + 140;
      x.font = `700 34px ${sans}`;
      x.textBaseline = "middle";
      x.fillStyle = LEFT_C;
      x.textAlign = "left";
      fitText(x, ax.leftLabel, left, midY, labelW, 34, `700 ? ${sans}`);
      x.fillStyle = RIGHT_C;
      x.textAlign = "right";
      fitText(x, ax.rightLabel, right, midY, labelW, 34, `700 ? ${sans}`);
      x.textAlign = "left";
      x.textBaseline = "alphabetic";

      const bx = left + labelW + 16, bw = (right - labelW - 16) - bx, bh = 26;
      const g = x.createLinearGradient(bx, 0, bx + bw, 0);
      g.addColorStop(0, "#e2a58c");
      g.addColorStop(0.5, "#ece3d3");
      g.addColorStop(1, "#9fbcd0");
      x.fillStyle = g;
      roundRect(x, bx, midY - bh / 2, bw, bh, bh / 2); x.fill();

      const dotR = 22;
      const cx = Math.min(bx + bw - dotR, Math.max(bx + dotR, bx + p * bw));
      x.fillStyle = "#ffffff";
      x.beginPath(); x.arc(cx, midY, dotR + 5, 0, Math.PI * 2); x.fill();
      x.fillStyle = INK;
      x.beginPath(); x.arc(cx, midY, dotR, 0, Math.PI * 2); x.fill();
    } else {
      // 教會治理：三個膠囊
      let cx = left;
      const cy = y + 110;
      x.font = `700 32px ${sans}`;
      for (const k of Object.keys(ax.kinds)) {
        const t = `${ax.kinds[k].name} ${r.counts[k]}`;
        const tw = x.measureText(t).width + 48;
        const on = r.kinds.includes(k);
        x.fillStyle = on ? LEFT_C : "#efe6d6";
        roundRect(x, cx, cy, tw, 62, 31); x.fill();
        x.fillStyle = on ? "#ffffff" : "#5e574c";
        x.fillText(t, cx + 24, cy + 43);
        cx += tw + 16;
      }
    }

    y += panelH + gap;
  }

  // 彩蛋
  if (state.bonus !== null) {
    const boxY = y + 16, boxH = 160;
    x.fillStyle = INK;
    roundRect(x, panelX, boxY, panelW, boxH, 24); x.fill();
    x.textAlign = "center";
    x.fillStyle = "#d9cfbd";
    x.font = `500 32px ${sans}`;
    x.fillText("我最怕基督教失去", W / 2, boxY + 60);
    x.fillStyle = "#f6f1e7";
    fitText(x, BONUS.o[state.bonus], W / 2, boxY + 124, panelW - 60, 52, `900 ? ${serif}`);
    x.textAlign = "left";
  }

  x.fillStyle = "#857d70";
  x.font = `400 26px ${sans}`;
  x.textAlign = "center";
  x.fillText(CONFIG.podcastName + "　·　你的基督徒光譜，長什麼樣子？", W / 2, H - 60);
  x.textAlign = "left";

  const url = c.toDataURL("image/png");
  $("cardImg").src = url;
  $("cardImg").classList.remove("hidden");
  $("cardHint").classList.remove("hidden");
  $("dlBtn").href = url;
  $("dlBtn").classList.remove("hidden");
}

// 文字太長時自動縮小字級，避免超出範圍；fontTpl 裡的 ? 會換成字級
function fitText(ctx, text, tx, ty, maxW, size, fontTpl) {
  let s = size;
  ctx.font = fontTpl.replace("?", s + "px");
  while (ctx.measureText(text).width > maxW && s > 20) {
    s -= 2;
    ctx.font = fontTpl.replace("?", s + "px");
  }
  ctx.fillText(text, tx, ty);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================
   啟動
   ============================================ */
if ($("kicker")) $("kicker").textContent = CONFIG.podcastName;
if (CONFIG.podcastUrl) {
  $("footer").innerHTML = `<a href="${CONFIG.podcastUrl}" target="_blank" rel="noopener">${CONFIG.podcastName}</a>　·　基督徒的光譜圖鑑`;
  $("listenBtn").href = CONFIG.podcastUrl;
  $("listenBox").classList.remove("hidden");
} else {
  $("footer").textContent = CONFIG.podcastName + "　·　基督徒的光譜圖鑑";
}

const saved = load();
if (saved) {
  if (saved.done) { state = saved; showResult(); }
  else if (saved.ans.some(v => v !== null)) $("resumeBtn").classList.remove("hidden");
}

$("startBtn").onclick = () => {
  state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false };
  save(); show("quiz"); renderQ();
};
$("resumeBtn").onclick = () => { state = saved; show("quiz"); renderQ(); };
$("prevBtn").onclick = prev;
$("nextBtn").onclick = next;
$("makeCardBtn").onclick = makeCard;
fillSelect($("churchSel"), CHURCH_TYPES);
fillSelect($("yearsSel"), YEARS);
$("finishBtn").onclick = finish;
$("bgBackBtn").onclick = () => { show("quiz"); renderQ(); };
$("restartBtn").onclick = () => { clearSave(); state = { i: 0, ans: Array(Q.length).fill(null), bonus: null, done: false }; show("intro"); $("resumeBtn").classList.add("hidden"); };
</script>
